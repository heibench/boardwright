# Release: push a v* tag on main -> build -> verify the artifact -> publish to PyPI.
#
# Publishing uses PyPI Trusted Publishing (OIDC); no token lives in this repo.
# The publisher registered on PyPI names this workflow file and the `pypi`
# environment; renaming either breaks the binding.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # Nothing below runs the tests: a tag off main would publish code the
      # Check workflow never saw.
      - name: Assert the tag is on main
        run: scripts/assert_tag_on_main.sh "$GITHUB_SHA" origin/main

      - name: Assert the tag matches the package version
        run: |
          declared=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tagged="${GITHUB_REF_NAME#v}"
          echo "pyproject: $declared, tag: $tagged"
          [ "$declared" = "$tagged" ] || { echo "::error::tag $GITHUB_REF_NAME does not match version $declared"; exit 1; }

      - name: Assert __version__ matches
        run: |
          grep -qx "__version__ = \"${GITHUB_REF_NAME#v}\"" src/boardwright/__init__.py \
            || { echo "::error::src/boardwright/__init__.py does not say ${GITHUB_REF_NAME#v}"; exit 1; }

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata
        run: uvx twine check --strict dist/*

      # A cold install, the environment every `pip install boardwright` starts from.
      - name: Smoke-test the wheel
        run: |
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install --no-config dist/*.whl
          version=$(/tmp/smoke/bin/boardwright --version)
          echo "$version"
          [ "$version" = "boardwright ${GITHUB_REF_NAME#v}" ] || { echo "::error::--version says '$version'"; exit 1; }
          /tmp/smoke/bin/boardwright review examples/boards/ldo_breakout/ldo_breakout.kicad_pcb

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # SHA-pinned: this action holds the OIDC identity for PyPI.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: GitHub release
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "boardwright $version" --notes-file notes.md
