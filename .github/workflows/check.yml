name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
      - run: just setup
      - run: just check

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: just setup
      - run: just test

  # The whole loop against a real KiCad 10 and Freerouting: generate the LDO
  # example, run the KiCad gate, verify. The test skips where either is missing,
  # so this job also asserts that it did not skip.
  kicad:
    name: KiCad pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BOARDWRIGHT_FREEROUTING: java -Djava.awt.headless=true -jar ${{ github.workspace }}/.ci/freerouting.jar
      FREEROUTING_SHA256: f6f51bb02245e8e717f9359bd260cc9c5c0b1bc0acc8b7cb2cd5b8ffeb5de3c7
      KICAD_DEB: 10.0.8~ubuntu24.04.1   # the PPA's build CI installed on 2026-11-17
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      # KiCad's packages come from the kicad-10.0-releases PPA, which answered
      # 503 on 2026-11-17 in runs 44137380840, 44147233321, 44151274245 and
      # 44154397602, the last for about 5 minutes despite apt's retries. They
      # are downloaded once per KiCad version and cached; a cached run never asks
      # the PPA. Bump KICAD_DEB when the PPA moves on (it keeps only the latest).
      - name: Restore KiCad packages
        id: kicad-debs
        uses: actions/cache/restore@v4
        with:
          path: .ci/kicad-debs
          key: kicad-debs-${{ env.KICAD_DEB }}-ubuntu-24.04
      - name: Download KiCad packages
        if: steps.kicad-debs.outputs.cache-hit != 'true'
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get clean
          sudo apt-get -o Acquire::Retries=5 install -y --download-only --no-install-recommends \
            kicad="$KICAD_DEB" kicad-symbols="$KICAD_DEB" kicad-footprints="$KICAD_DEB" kicad-demos="$KICAD_DEB"
          mkdir -p .ci/kicad-debs   # only these four come from the PPA; their dependencies come from Ubuntu
          cp /var/cache/apt/archives/kicad_*.deb /var/cache/apt/archives/kicad-symbols_*.deb \
             /var/cache/apt/archives/kicad-footprints_*.deb /var/cache/apt/archives/kicad-demos_*.deb .ci/kicad-debs/
      - name: Save KiCad packages
        if: steps.kicad-debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci/kicad-debs
          key: kicad-debs-${{ env.KICAD_DEB }}-ubuntu-24.04
      - name: Install KiCad 10
        run: |
          ls .ci/kicad-debs/
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends ./.ci/kicad-debs/*.deb xvfb librsvg2-bin
          kicad-cli version
      - name: Fetch Freerouting 2.5.0
        run: |
          mkdir -p .ci
          curl -sSfL -o .ci/freerouting.jar https://github.com/freerouting/freerouting/releases/download/v2.5.0/freerouting-2.5.0.jar
          echo "$FREEROUTING_SHA256  .ci/freerouting.jar" | sha256sum -c -
      - run: just setup
      - run: uv run boardwright doctor
      - name: Generate, gate and verify the LDO example; schematic edits judged by KiCad
        shell: bash  # -o pipefail, so tee does not hide a failure
        run: xvfb-run -a uv run pytest tests/test_pipeline.py tests/test_sch_repoint.py tests/test_sch_add.py tests/test_sch_subsheet.py tests/test_update.py tests/test_clearance.py -v -rs | tee pipeline.log
      - name: Assert nothing skipped
        run: |
          if grep -q SKIPPED pipeline.log; then echo "::error::the pipeline test skipped"; exit 1; fi

  ok:
    name: ok
    if: always()
    needs: [lint, test, kicad]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo 'All checks passed'
