name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: just setup
      - run: just check

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: just setup
      - run: just test

  # The whole loop against a real KiCad 10 and Freerouting: generate the LDO
  # example, run the KiCad gate, verify. The test skips where either is missing,
  # so this job also asserts that it did not skip.
  kicad:
    name: KiCad pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BOARDWRIGHT_FREEROUTING: java -Djava.awt.headless=true -jar ${{ github.workspace }}/.ci/freerouting.jar
      FREEROUTING_SHA256: f6f51bb02245e8e717f9359bd260cc9c5c0b1bc0acc8b7cb2cd5b8ffeb5de3c7
      KICAD_DEB: 10.0.8~ubuntu24.04.1   # the PPA's build CI installed on 2026-11-17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      # KiCad's packages come from the kicad-10.0-releases PPA, which answered
      # 503 on 2026-11-17 in runs 44137380840, 44147233321, 44151274245 and
      # 44154397602, the last for about 5 minutes despite apt's retries. Their
      # Ubuntu dependencies come from the runner's mirror, which on the 0.8.0
      # release PR (run 44419738131) was slow enough to run this job out of its
      # 30 minutes (#81). Every package is downloaded once per KiCad version and
      # runner image and cached; a cached run asks neither the PPA nor the
      # mirror. Bump KICAD_DEB when the PPA moves on (it keeps only the latest).
      - name: Runner image
        id: image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Restore KiCad packages
        id: kicad-debs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci/kicad-debs
          key: kicad-debs-${{ env.KICAD_DEB }}-ubuntu-24.04-${{ steps.image.outputs.version }}
      - name: Download KiCad packages
        if: steps.kicad-debs.outputs.cache-hit != 'true'
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get clean
          sudo apt-get -o Acquire::Retries=5 install -y --download-only --no-install-recommends \
            kicad="$KICAD_DEB" kicad-symbols="$KICAD_DEB" kicad-footprints="$KICAD_DEB" kicad-demos="$KICAD_DEB" \
            xvfb librsvg2-bin
          mkdir -p .ci/kicad-debs   # KiCad's four from the PPA, and everything they and the job need from Ubuntu
          cp /var/cache/apt/archives/*.deb .ci/kicad-debs/
          ls .ci/kicad-debs | wc -l
          du -sh .ci/kicad-debs
      - name: Save KiCad packages
        if: steps.kicad-debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci/kicad-debs
          key: kicad-debs-${{ env.KICAD_DEB }}-ubuntu-24.04-${{ steps.image.outputs.version }}
      - name: Install KiCad 10
        run: |
          ls .ci/kicad-debs/ | wc -l
          # From the cached packages alone, with dpkg: apt resolves against its
          # package lists even with --no-download, and on a cache hit they are
          # the image's stale ones, so it went to the mirror (run 44928663503).
          # The key names the image, so these are what it is missing. Only if
          # they fall short does apt fetch the rest and finish the install.
          if ! sudo dpkg -i ./.ci/kicad-debs/*.deb; then
            echo "::warning::cached packages did not cover the install; fetching from the mirror"
            sudo apt-get -o Acquire::Retries=5 update
            sudo apt-get -o Acquire::Retries=5 install -y -f --no-install-recommends ./.ci/kicad-debs/*.deb xvfb librsvg2-bin
          fi
          kicad-cli version
      - name: Fetch Freerouting 2.5.0
        run: |
          mkdir -p .ci
          curl -sSfL -o .ci/freerouting.jar https://github.com/freerouting/freerouting/releases/download/v2.5.0/freerouting-2.5.0.jar
          echo "$FREEROUTING_SHA256  .ci/freerouting.jar" | sha256sum -c -
      - run: just setup
      - run: uv run boardwright doctor
      - name: Generate, gate and verify the LDO example; schematic edits judged by KiCad
        shell: bash  # -o pipefail, so tee does not hide a failure
        run: xvfb-run -a uv run pytest tests/test_pipeline.py tests/test_sch_repoint.py tests/test_sch_add.py tests/test_sch_subsheet.py tests/test_sch_move.py tests/test_update.py tests/test_clearance.py -v -rs | tee pipeline.log
      - name: Assert nothing skipped
        run: |
          if grep -q SKIPPED pipeline.log; then echo "::error::the pipeline test skipped"; exit 1; fi

  ok:
    name: ok
    if: always()
    needs: [lint, test, kicad]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo 'All checks passed'
